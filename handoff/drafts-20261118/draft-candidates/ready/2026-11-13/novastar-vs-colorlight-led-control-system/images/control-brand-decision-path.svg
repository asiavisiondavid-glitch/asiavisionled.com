   <g id="text_1">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(108.348047 170.183672)">1. Do you already run a</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(112.986563 186.387363)">NovaStar or Colorlight</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(134.776406 202.591055)">fleet or sender?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(550.188813 169.712891)">MATCH IT</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(498.293656 186.516719)">Same family, same card</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(504.495219 203.320547)">model, same firmware</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(880.1035 170.653906)">Get in writing: sender, card,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(900.885219 186.257461)">firmware, config files,</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(920.027719 201.861016)">calibration data</text>
   </g>
