   <g id="text_1">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(121.539219 158.963352)">1. Can people reach or touch</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(165.367969 175.76718)">the screen face?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(156.450625 276.899352)">2. Is it a sports hall</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(172.740938 293.70318)">with ball play?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(132.675781 394.835352)">3. Public, unsupervised or</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(181.190156 411.63918)">vandal risk?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(705.214297 151.501906)">NO: standard face is fine.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(704.971563 167.105461)">Protect it during handling</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(751.865 182.709016)">and install.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(697.289375 269.437906)">YES: DIN 18032-3 report for</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(690.441016 285.041461)">the whole element and fixing.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(732.185234 300.645016)">IK is not the test.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(685.296875 387.373906)">YES: sealed face (COB or GOB).</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(697.620469 402.977461)">Ask for an IEC 62262 report</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(721.733438 418.581016)">for the exact model.</text>
   </g>
