   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="209.088" y="205.848" transform="rotate(-0 209.088 205.848)">SMD</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="209.088" y="411.400953" transform="rotate(-0 209.088 411.400953)">PCB</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(132.231281 287.324172)">Separate lamps stand</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(123.373 304.128)">above the board surface</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="209.088" y="447.336" transform="rotate(-0 209.088 447.336)">Lowest cost; suits protected positions</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="576" y="205.848" transform="rotate(-0 576 205.848)">GOB</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="576" y="411.400953" transform="rotate(-0 576 411.400953)">PCB</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(498.828281 287.324172)">Lamps as SMD, with a</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(473.927969 304.128)">protective coating over them</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="576" y="447.336" transform="rotate(-0 576 447.336)">Coating added over a conventional module</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="942.912" y="205.848" transform="rotate(-0 942.912 205.848)">COB</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="942.912" y="411.400953" transform="rotate(-0 942.912 411.400953)">PCB</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(847.340125 287.324172)">Chips bonded to the board,</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(853.900438 304.128)">sealed under one surface</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="942.912" y="447.336" transform="rotate(-0 942.912 447.336)">No individual lamp to knock off</text>
   </g>
   <g id="text_13">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b1f3a" x="576" y="540" transform="rotate(-0 576 540)">The face shapes how a module copes with knocks. Only a test on the finished product gives an IK class.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="34.56" y="45.36" transform="rotate(-0 34.56 45.36)">Three LED face structures, in cross-section</text>
  </g>
  <g id="text_15">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="34.56" y="74.52" transform="rotate(-0 34.56 74.52)">Schematic only, not to scale. No IK rating is implied by any structure.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="17.28" y="636.336" transform="rotate(-0 17.28 636.336)">Sources: Asia Vision product pages (COB Z, COB EH-PRO, COB EF, X Series, R-PRO, M-PRO); schematic.</text>
  </g>
