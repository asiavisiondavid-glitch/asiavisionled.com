   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="36.216" y="136.477266" transform="rotate(-0 36.216 136.477266)">Topic</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="240.84" y="136.477266" transform="rotate(-0 240.84 136.477266)">The question it answers</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="734.76" y="136.477266" transform="rotate(-0 734.76 136.477266)">Usual document</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="232.265802" transform="rotate(-0 36.216 232.265802)">RoHS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 223.734552)">Does the product contain restricted hazardous</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 240.53838)">substances above set limits?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 223.734552)">Test report or declaration of conformity</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 240.53838)">per product</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="370.793802" transform="rotate(-0 36.216 370.793802)">REACH</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 362.262552)">Does the product contain substances of very high</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 379.06638)">concern, and what must be told to the customer?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 362.262552)">Supplier declaration based on the</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 379.06638)">candidate list</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="509.322368" transform="rotate(-0 36.216 509.322368)">Conflict minerals</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 492.388638)">Do you know which smelters and refiners processed</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 509.192466)">the tin, tantalum, tungsten and gold in the supply</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.84 525.996294)">chain?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 500.791098)">CMRT with smelter list, plus a policy</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(734.76 517.593833)">statement</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="34.56" y="45.36" transform="rotate(-0 34.56 45.36)">Three compliance questions, three documents</text>
  </g>
  <g id="text_14">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="34.56" y="74.52" transform="rotate(-0 34.56 74.52)">A RoHS certificate does not answer a conflict minerals request</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="17.28" y="636.336" transform="rotate(-0 17.28 636.336)">Sources: RMI reporting templates; Asia Vision RoHS and REACH guides (linked in the article).</text>
  </g>
 </g>
