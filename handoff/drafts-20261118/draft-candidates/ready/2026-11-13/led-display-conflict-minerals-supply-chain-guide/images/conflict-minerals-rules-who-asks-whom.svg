   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="36.216" y="136.477266" transform="rotate(-0 36.216 136.477266)">Framework</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="311.4" y="136.477266" transform="rotate(-0 311.4 136.477266)">Directly covers</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="727.704" y="136.477266" transform="rotate(-0 727.704 136.477266)">What reaches an LED display supplier</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(36.216 206.588718)">US Dodd-Frank Section 1502</text>
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(36.216 222.792409)">(SEC rule, Form SD)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 198.957106)">Companies that file with the SEC and whose</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 214.560661)">products contain 3TG necessary to function</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 230.164216)">or production</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 198.957106)">A country-of-origin inquiry and a request</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 214.560661)">for a CMRT from the supplier of the product</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 230.164216)">or its parts</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="318.586563" transform="rotate(-0 36.216 318.586563)">EU Regulation 2017/821</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 302.853106)">EU importers of 3TG ores, concentrates and</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 318.456661)">metals. Companies beyond the metal stage</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 334.060216)">have no obligations under it</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 310.654884)">Usually nothing directly. Customers may</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 326.258438)">still ask for reporting tools to be used</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="422.482563" transform="rotate(-0 36.216 422.482563)">OECD Due Diligence Guidance</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 414.550884)">Nobody by law. The reference both rules</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(311.4 430.154438)">point to</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 414.550884)">The five-step language used in</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 430.154438)">questionnaires and supplier codes</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="36.216" y="526.378563" transform="rotate(-0 36.216 526.378563)">Buyer contract or tender</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="311.4" y="526.248661" transform="rotate(-0 311.4 526.248661)">Whoever signs it</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 518.446884)">A clause naming the CMRT, a policy or an</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(727.704 534.050438)">audit scheme</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="34.56" y="45.36" transform="rotate(-0 34.56 45.36)">Who is directly covered, and what reaches an LED display supplier</text>
  </g>
  <g id="text_17">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="34.56" y="74.52" transform="rotate(-0 34.56 74.52)">Summary of the main frameworks; not legal advice</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="17.28" y="636.336" transform="rotate(-0 17.28 636.336)">Sources: SEC conflict minerals guide; European Commission, Conflict Minerals Regulation explained; OECD. Not legal advice.</text>
  </g>
 </g>
