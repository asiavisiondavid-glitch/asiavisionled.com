   </g>
   <g id="text_12">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(704.30862 434.719344)">Space for one to two</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(697.95087 448.162406)">workers (Leyard/Planar</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(710.01187 461.605469)">TWA install guide).</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(691.432995 475.048531)">If the authority treats the</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(687.69412 488.490719)">power gear as NEC 110.26</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(687.008995 501.933781)">equipment: 900 mm depth</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(701.192745 515.376844)">for ≤150 V to ground.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 281.613268)">Service from behind:</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 296.616686)">modules, PSU and cards</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 311.620104)">reached without touching</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 326.623521)">the face. The room loses</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 341.626939)">the corridor floor area for</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(948.878491 356.630357)">the life of the wall.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e07a1f" x="606.647547" y="110.64" transform="rotate(-0 606.647547 110.64)">Rear service: a corridor behind the screen</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b1f3a" x="34.56" y="45.36" transform="rotate(-0 34.56 45.36)">Where the technician stands decides the wall depth</text>
  </g>
  <g id="text_16">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="34.56" y="74.52" transform="rotate(-0 34.56 74.52)">Schematic section, not to scale</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a94a6" x="17.28" y="636.336" transform="rotate(-0 17.28 636.336)">Sources: Leyard TWA Series installation guide (planar.com); NFPA 70 (NEC) 110.26 Table 110.26(A)(1). Confirm local rules with the authority having jurisdiction.</text>
  </g>
