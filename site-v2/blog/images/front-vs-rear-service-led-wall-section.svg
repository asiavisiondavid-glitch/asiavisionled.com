   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 281.613268)">Service from the viewing side:</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 296.616686)">magnetic or screw-fixed modules,</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 311.620104)">removed with a suction / magnet tool.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 326.623521)">Power and receiving card reached</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 341.626939)">through the module opening</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(335.927547 356.630357)">(design-dependent).</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #2a9d3f" transform="translate(335.927547 463.053268)">No corridor behind the wall.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #2a9d3f" transform="translate(335.927547 478.056686)">Floor space in front is needed</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #2a9d3f" transform="translate(335.927547 493.060104)">only while servicing.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e73be" x="34.56" y="110.64" transform="rotate(-0 34.56 110.64)">Front service: cabinet mounts close to the wall</text>
   </g>
  </g>
