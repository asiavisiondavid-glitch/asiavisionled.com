   <g id="text_1">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(100.431422 167.879672)">1. Is there usable space</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(108.476578 184.083363)">behind the screen for</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(116.35193 200.287055)">the life of the wall?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(500.634141 167.879672)">2. Will the owner keep</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(510.861445 184.083363)">that space clear, lit</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(524.216953 200.287055)">and reachable?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(896.83643 167.879672)">REAR or DUAL service</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(893.981391 184.083363)">Rear access, with front</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(910.615922 200.287055)">service as backup</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(323.561297 379.876969)">FRONT service</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(170.836688 397.88107)">Thin mount, protrusion check (ADA 307.2 or local rule),</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(173.887078 415.885172)">service tool and spare modules on the bill of materials</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(915.237562 393.378375)">Check either way:</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(971.136 408.380816)"/>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(888.551039 423.384234)">- outdoor walls with heavy</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(889.158461 438.387652)">  modules or frequent PSU</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(895.415297 453.39107)">  swaps: plan a walkway</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(932.22682 468.394488)">  or platform</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(891.423109 483.397906)">- installed depth from the</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(902.597914 498.401324)">  cabinet drawing, not</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #0b1f3a" transform="translate(921.069594 513.404742)">  the spec sheet</text>
   </g>
